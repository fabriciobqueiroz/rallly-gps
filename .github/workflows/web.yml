name: Publicar site do organizador

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ajustar endereço do site
        run: node -e "const f='app.json',j=require('./'+f);j.expo.experiments={baseUrl:'/'+process.env.GITHUB_REPOSITORY.split('/')[1]};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - run: npx expo export --platform web --output-dir dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
